    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020813" />
      <stop offset="50%" stop-color="#071933" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>
