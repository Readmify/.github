    <text x="600" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#90e0ef" letter-spacing="2.5">MAINTAINED BY AYUSH RAJ (@AYUSHCMD)  •  STAR OUR REPOS TO SUPPORT</text>
